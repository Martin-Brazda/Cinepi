version: "3.9"

services:
  client-ui:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: cinepi-client-ui
    working_dir: /app
    restart: unless-stopped
    environment:
      # Point this at your separately hosted API backend.
      # Example: https://api.yourdomain.com/api/v1
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    command: >
      sh -c "npm install --unsafe-perm && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app:z

  remote-bridge:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: cinepi-remote-bridge
    working_dir: /app
    restart: unless-stopped
    environment:
      REMOTE_BRIDGE_PORT: ${REMOTE_BRIDGE_PORT:-8099}
    command: >
      sh -c "npm install --unsafe-perm && npm run remote:bridge"
    ports:
      - "8099:8099"
    volumes:
      - ./client:/app:z

  postgres:
    image: postgres:16
    container_name: cinepi-postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: cinepi
      POSTGRES_USER: cinepi
      POSTGRES_PASSWORD: cinepi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinepi -d cinepi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
